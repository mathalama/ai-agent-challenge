services:
  app:
    build: .
    image: requirements-review
    # Внутри контейнера сервер слушает все адреса, наружу порт открыт только для localhost.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    command: ["serve", "--listen", "0.0.0.0:3000", "--provider", "${PROVIDER:-mock}"]
    volumes:
      - llm-cache:/app/.cache
      - ./reports:/app/reports

volumes:
  llm-cache:
