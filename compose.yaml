services:
  app:
    build:
      context: .
      args:
        AGENT_VERSION: ${AGENT_VERSION:-}
    image: requirements-review
    # Внутри контейнера сервер слушает все адреса, наружу порт открыт только для localhost.
    ports:
      - "127.0.0.1:${PORT:-3333}:3333"
    env_file:
      - path: .env
        required: false
    environment:
      RS_PROVIDER: ${PROVIDER:-}
      RS_TRUST_LOCAL_HOST: "1"
    command: ["serve", "--listen", "0.0.0.0:3333"]
    volumes:
      - llm-cache:/app/.cache
      - rs-config:/app/config
      - ./reports:/app/reports

volumes:
  llm-cache:
  rs-config:
