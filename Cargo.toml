[workspace]
members = ["crates/doc", "crates/llm", "crates/review", "crates/agent", "crates/cli", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false }
httpdate = "1"
jsonschema = { version = "0.46", default-features = false }
lopdf = "0.42"
pdfsink-rs = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
doc = { path = "crates/doc" }
llm = { path = "crates/llm" }
review = { path = "crates/review" }
agent = { path = "crates/agent" }
server = { path = "crates/server" }
